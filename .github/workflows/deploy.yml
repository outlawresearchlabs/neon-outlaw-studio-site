name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: neon-outlaw-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out site
        uses: actions/checkout@v6
      - name: Report missing deployment credential
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Cloudflare deployment is waiting for the CLOUDFLARE_API_TOKEN repository secret."
      - name: Deploy production site
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: cd6158164a8410a6462db00626007573
          command: pages deploy . --project-name=neon-outlaw-studio --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
